[workspace]
members = ["crates/bamsplit-core", "crates/bamsplit-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
authors = ["Alejandro Gonzales-Irribarren <alejandrxgzi@gmail.com>"]
repository = "https://github.com/alejandrogzi/bamsplit"
homepage = "https://github.com/alejandrogzi/bamsplit"
readme = "README.md"
keywords = ["bam", "bioinformatics", "bgzf", "genomics", "split"]
categories = ["command-line-utilities", "science"]

[workspace.dependencies]
bamsplit-core = { version = "0.0.1", path = "crates/bamsplit-core" }
bamsplit = { version = "0.0.1", path = "crates/bamsplit-cli" }

noodles-bam = "0.93"
noodles-bgzf = "0.50"
noodles-sam = "0.88"
noodles-csi = "0.59"
noodles-core = "0.20"

# Every BED/GTF/GFF dialect is parsed through `genepred` rather than growing a
# second implementation. See docs/region-routing.md.
genepred = { version = "0.0.16", features = ["mmap", "rayon", "gzip", "zstd", "bz2"] }

bstr = "1.13"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
crossbeam-channel = "0.5"
bzip2 = "0.6"
crc32fast = "1.5"
csv = "1.4"
# `zlib-rs` is a pure-Rust port of zlib-ng. Measured against the default
# `miniz_oxide` backend on a 306 MB, 2 M-record BAM (see docs/performance.md):
# 2.0x faster single-threaded and 3.9% smaller output at the same level 6, with
# no C toolchain and no `unsafe` in this crate.
flate2 = { version = "1.1", features = ["zlib-rs"] }
zstd = "0.13"
indexmap = { version = "2.14", features = ["serde"] }
memmap2 = "0.9"
percent-encoding = "2.3"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1.15", features = ["union"] }
tempfile = "3.27"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ctrlc = { version = "3.5", features = ["termination"] }

assert_cmd = "2.2"
criterion = "0.8"
insta = { version = "1.48", features = ["json"] }
predicates = "3.1"
proptest = "1.11"

[package]
# Named `bamsplit-fixtures`, not `bamsplit`: the CLI crate already produces a
# binary called `bamsplit`, and two targets with that name collide in the doc
# and artifact directories.
name = "bamsplit-fixtures"
description = "Synthetic BAM fixtures, benchmarks, and end-to-end tests for bamsplit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "bamsplit_fixtures"
path = "src/lib.rs"

[[bin]]
name = "bamsplit-generate-fixtures"
path = "scripts/generate-fixtures.rs"

[features]
default = []
# Enables integration tests that shell out to an external `samtools` binary.
# Without it those tests are skipped rather than failing on a machine that has
# no samtools.
differential = []

[dependencies]
bamsplit-core.workspace = true
noodles-bgzf.workspace = true
tempfile.workspace = true
bzip2.workspace = true
flate2.workspace = true
zstd.workspace = true

[dev-dependencies]
bamsplit.workspace = true
assert_cmd.workspace = true
criterion.workspace = true
predicates.workspace = true
proptest.workspace = true
serde_json.workspace = true
noodles-bam.workspace = true
noodles-csi.workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "differential"
path = "tests/differential/main.rs"

[[bench]]
name = "core"
path = "benches/core.rs"
harness = false

[[bench]]
name = "end_to_end"
path = "benches/end_to_end.rs"
harness = false

[[example]]
name = "library_split"
path = "examples/library_split.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.bench]
debug = true
